<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicamentos - MedicalField</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div th:replace="~{navbar :: mainNav}"></div>

    <!-- Conteúdo Principal -->
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-secondary">Catálogo de Medicamentos</h3>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 15%;">ID</th>
                            <th>Nome do Medicamento</th>
                            <th>Concentração</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="medication : ${medications}">
                            <td class="fw-bold" th:text="${medication.id}">1</td>
                            <td th:text="${medication.name}">Dipirona Sódica</td>
                            <td th:text="${medication.concentration}">500mg/ml</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(medications)}">
                            <td colspan="3" class="text-center text-muted p-4">Nenhum medicamento cadastrado no sistema.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
