<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - MedicalField</title>
    <!-- Adicionando o Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS rápido para centralizar a tela inteira -->
    <style>
        body, html {
            height: 100%;
            background-color: #f8f9fa; /* Cinza bem claro do Bootstrap */
        }
        .login-wrapper {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Um cartão com sombra, bordas arredondadas e largura fixa -->
        <div class="card shadow-lg border-0 rounded-4" style="width: 25rem;">
            <div class="card-body p-5">
                
                <!-- Cabeçalho do Login -->
                <div class="text-center mb-4">
                    <h2 class="text-primary fw-bold">MedicalField</h2>
                    <p class="text-muted">Acesso Administrativo</p>
                </div>

                <!-- O Thymeleaf mostra esta mensagem de erro automaticamente se o login falhar -->
                <div th:if="${param.error}" class="alert alert-danger text-center rounded-3">
                    Usuário ou senha inválidos.
                </div>

                <!-- O formulário envia os dados para o próprio /login (interceptado pelo Spring Security) -->
                <form th:action="@{/login}" method="post">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Usuário</label>
                        <!-- O name="username" é obrigatório para o Spring Security -->
                        <input type="text" class="form-control form-control-lg bg-light" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Senha</label>
                        <!-- O name="password" é obrigatório para o Spring Security -->
                        <input type="password" class="form-control form-control-lg bg-light" id="password" name="password" placeholder="Digite sua senha" required>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold">
                            Entrar no Sistema
                        </button>
                    </div>
                    
                </form>

            </div>
        </div>
    </div>

    <!-- Script para limpar o ?error da URL, evitando que a mensagem persista ao recarregar a página -->
    <script th:if="${param.error}">
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.pathname);
        }
    </script>
</body>
</html>
