<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arquitetura do Sistema - MedicalField</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{navbar :: mainNav}"></div>

<div class="container-fluid mt-4 px-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-secondary">Arquitetura do Sistema</h3>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body text-center p-4">
            <div class="p-3 bg-white border rounded shadow-sm d-inline-block" style="width: 100%; max-width: 1000px;">
                <img th:src="@{/images/arquitetura.svg}" src="/images/arquitetura.svg" alt="Diagrama da Arquitetura do Sistema"
                     style="width: 100%; height: auto; display: block; margin: 0 auto;">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
