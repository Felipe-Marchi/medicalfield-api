<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pacientes - MedicalField</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div th:replace="~{navbar :: mainNav}"></div>

    <!-- Conteúdo Principal -->
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-secondary">Cadastro de Pacientes</h3>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>CPF</th>
                            <th>Nome Completo</th>
                            <th>Data de Nascimento</th>
                            <th>Gênero</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="patient : ${patients}">
                            <td class="fw-bold"
                                th:text="${#strings.substring(patient.cpf, 0, 3) + '.' + #strings.substring(patient.cpf, 3, 6) + '.' + #strings.substring(patient.cpf, 6, 9) + '-' + #strings.substring(patient.cpf, 9, 11)}">
                                123.456.789-01
                            </td>
                            
                            <td th:text="${patient.name}">João da Silva</td>
                            
                            <!-- Formatando o LocalDate nativamente com o Thymeleaf -->
                            <td th:text="${#temporals.format(patient.birthDate, 'dd/MM/yyyy')}">01/01/1990</td>
                            
                            <!-- Exibindo M ou F -->
                            <td th:text="${patient.gender}">M</td>
                        </tr>
                        
                        <tr th:if="${#lists.isEmpty(patients)}">
                            <td colspan="4" class="text-center text-muted p-4">Nenhum paciente cadastrado no sistema.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
