<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logs de Auditoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div th:replace="~{navbar :: mainNav}"></div>

    <div class="container-fluid mt-4 px-4">
        <h3 class="mb-4">📋 Logs de Auditoria do Sistema</h3>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive" style="max-height: 70vh;">
                    <table class="table table-striped table-hover table-sm m-0">
                        <thead class="table-dark sticky-top">
                            <tr>
                                <th>Data/Hora</th>
                                <th>IP Origem</th>
                                <th>Usuário ID</th>
                                <th>Método</th>
                                <th>Rota</th>
                                <th>Status HTTP</th>
                                <th>Tempo (ms)</th>
                                <th>Mensagem</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log : ${logs}">
                                <td th:text="${#temporals.format(log.timestamp, 'dd/MM/yyyy HH:mm:ss')}"></td>
                                <td th:text="${log.clientIp}"></td>
                                <td th:text="${log.professionalId != null ? log.professionalId : 'N/A'}"></td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${log.httpMethod}"></span>
                                </td>
                                <td th:text="${log.route}"></td>
                                <td>
                                    <span th:classappend="${log.statusCode >= 400 ? 'badge bg-danger' : 'badge bg-success'}" 
                                          th:text="${log.statusCode}"></span>
                                </td>
                                <td th:text="${log.processingTimeMs + ' ms'}"></td>
                                <td th:text="${log.message}" class="text-truncate" style="max-width: 250px;" th:title="${log.message}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(logs)}">
                                <td colspan="8" class="text-center py-3">Nenhum log registrado ainda.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
