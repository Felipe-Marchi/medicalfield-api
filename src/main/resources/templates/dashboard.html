<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <!-- Adicionando o Bootstrap para deixar a tabela e botões bonitos rapidamente -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegação superior -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- Aqui o Thymeleaf injeta o título vindo do Java -->
            <span class="navbar-brand mb-0 h1" th:text="${titulo}">Dashboard</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-12 text-center">
                <h2>Bem-vindo ao Portal de Resgate</h2>
                <p>Nesta área você poderá visualizar os cadastros de apoio e os registros de atendimento.</p>
            </div>
        </div>
    </div>

</body>
</html>
